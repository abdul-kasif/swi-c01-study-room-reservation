<!-- OOB swap to show error in the form alerts area -->
<div id="form-alerts" hx-swap-oob="innerHTML">
  <div class="alert alert-danger alert-dismissible fade show py-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="alert"
      aria-label="Close"
    ></button>
  </div>
</div>
