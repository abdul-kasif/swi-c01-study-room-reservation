version: "3"

tasks:
  setup:
    desc: "Set up the Python virtual environment and install dependencies"
    cmds:
      - python3 -m venv venv
      - venv/bin/pip install -r requirements.txt

  run:
    desc: "Start the FastAPI development server"
    cmds:
      - venv/bin/uvicorn src.main:app --reload
