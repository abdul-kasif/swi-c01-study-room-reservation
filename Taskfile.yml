version: "3"

vars:
  # 1. Detect the platform-specific virtual environment folder name
  VENV_BIN: '{{if eq OS "windows"}}Scripts{{else}}bin{{end}}'

  # 2. Define the path to the Python executable within the virtual environment
  VENV_PYTHON: ".venv/{{.VENV_BIN}}/python"

tasks:
  setup:
    desc: "Set up the Python virtual environment and install dependencies"
    cmds:
      # Fix: Use .venv consistently
      - '{{if eq OS "windows"}}python{{else}}python3{{end}} -m venv .venv'
      - '"{{.VENV_PYTHON}}" -m pip install --upgrade pip'
      - '"{{.VENV_PYTHON}}" -m pip install -r requirements.txt'

  run:
    desc: "Start the FastAPI development server"
    cmds:
      - '"{{.VENV_PYTHON}}" -m uvicorn src.main:app --reload'

  test:
    desc: "Run automated tests"
    cmds:
      - '"{{.VENV_PYTHON}}" -m pytest'
